version: 2
# Version updates run on the 1st and 15th of each month (about every two weeks;
# Dependabot has no native biweekly interval). Security updates stay immediate.
updates:
  # Backend Python dependencies (uv.lock)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Root workspace tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Frontend (Next.js app)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Major upgrades are proposed only after the runtime enters LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Docs site
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Major upgrades are proposed only after the runtime enters LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Docker base images (tags and digests): backend/Dockerfile and
  # backend/docker/Dockerfile.test
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/backend/docker"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
    ignore:
      # Major upgrades are proposed only after the runtime enters LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Images referenced by the Compose stacks (local dev, test and deploy)
  - package-ecosystem: "docker-compose"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
    ignore:
      # A PostgreSQL major needs a data migration (pg_upgrade/dump); do it by hand.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # GitHub Actions workflows (SHA pins keep their version comment updated)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "America/Mexico_City"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
