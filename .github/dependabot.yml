version: 2
updates:
  # Backend Python dependencies (uv.lock)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5

  # Root workspace tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5

  # Frontend (Next.js app)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Runtime and containers stay on the active Node LTS line.
      - dependency-name: "@types/node"
        versions: ["25.x"]
    open-pull-requests-limit: 5

  # Docs site
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # Runtime and containers stay on the active Node LTS line.
      - dependency-name: "@types/node"
        versions: ["25.x"]
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
    ignore:
      # Node 25 is an EOL, non-LTS release; Node 24 remains the runtime target.
      - dependency-name: "node"
        versions: ["25.x"]
    open-pull-requests-limit: 5

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Solo entrega versiones ya "asentadas": retrasa las PRs programadas
    # (no las de seguridad, que van por Dependabot alerts y siguen inmediatas).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
