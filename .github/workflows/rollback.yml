name: Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service(s) to roll back'
        required: true
        type: choice
        default: both
        options:
          - backend
          - frontend
          - both
      target_environment:
        description: 'Target environment'
        required: true
        type: choice
        default: Production
        options:
          - Production
          - Development
      version:
        description: 'Image tag to deploy (e.g. v1.2.3 or sha-abc1234)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback-backend:
    if: ${{ github.repository != 'Llamitai/wise' && (inputs.service == 'backend' || inputs.service == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same group as build_backend.yml for the branch that feeds this environment,
    # so a rollback and an automatic deploy never race on one Portainer stack.
    concurrency:
      group: Build & Deploy / Backend-${{ inputs.target_environment == 'Production' && 'main' || 'dev' }}
      cancel-in-progress: false
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify backend image exists
        env:
          REPOSITORY_URI: ${{ vars.BACKEND_REPOSITORY_URI }}
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $IMAGE_VERSION"
            exit 1
          fi
          docker manifest inspect "${REPOSITORY_URI}:${IMAGE_VERSION}" > /dev/null
          echo "Image ${REPOSITORY_URI}:${IMAGE_VERSION} found."

      - name: Deploy backend to Portainer
        uses: cssnr/portainer-stack-deploy-action@08a2399c37369f461c258deef9cc8a1cf2db3271 # v2.0.0
        with:
          token: ${{ secrets.PORTAINER_TOKEN }}
          repo: ${{ github.repository }}
          ref: ${{ github.ref }}
          url: ${{ vars.PORTAINER_URL }}
          name: ${{ vars.BACKEND_DEPLOYMENT_SERVICE }}
          file: ${{ vars.BACKEND_DEPLOYMENT_COMPOSE_FILE }}
          standalone: true
          prune: true
          pull: true
          type: repo
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          env_data: >
            {
              "IMAGE_TAG": "${{ inputs.version }}",
              "INFISICAL_SECRET_ENV": "${{ vars.INFISICAL_SECRET_ENV }}",
              "PROJECT_ID": "${{ vars.BACKEND_PROJECT_ID }}",
              "INFISICAL_API_URL": "${{ vars.INFISICAL_API_URL }}",
              "INFISICAL_MACHINE_CLIENT_ID": "${{ secrets.INFISICAL_MACHINE_CLIENT_ID }}",
              "INFISICAL_MACHINE_CLIENT_SECRET": "${{ secrets.INFISICAL_MACHINE_CLIENT_SECRET }}",
              "ADMIN_SECRET": "${{ secrets.ADMIN_SECRET }}",
              "ADMIN_EMAIL": "${{ vars.ADMIN_EMAIL }}",
              "ADMIN_PASSWORD": "${{ secrets.ADMIN_PASSWORD }}",
              "ADMIN_DB_HOST": "${{ vars.ADMIN_DB_HOST }}",
              "ADMIN_DB_DATABASE": "${{ vars.ADMIN_DB_DATABASE }}",
              "ADMIN_DB_USER": "${{ vars.ADMIN_DB_USER }}",
              "ADMIN_DB_PASSWORD": "${{ secrets.ADMIN_DB_PASSWORD }}",
              "ADMIN_PUBLIC_URL": "${{ vars.ADMIN_PUBLIC_URL }}"
            }

  rollback-frontend:
    if: ${{ github.repository != 'Llamitai/wise' && (inputs.service == 'frontend' || inputs.service == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same group as build_frontend.yml for the branch that feeds this environment,
    # so a rollback and an automatic deploy never race on one Portainer stack.
    concurrency:
      group: Build & Deploy / Frontend-${{ inputs.target_environment == 'Production' && 'main' || 'dev' }}
      cancel-in-progress: false
    environment: ${{ inputs.target_environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify frontend image exists
        env:
          REPOSITORY_URI: ${{ vars.FRONTEND_REPOSITORY_URI }}
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag: $IMAGE_VERSION"
            exit 1
          fi
          docker manifest inspect "${REPOSITORY_URI}:${IMAGE_VERSION}" > /dev/null
          echo "Image ${REPOSITORY_URI}:${IMAGE_VERSION} found."

      - name: Deploy frontend to Portainer
        uses: cssnr/portainer-stack-deploy-action@08a2399c37369f461c258deef9cc8a1cf2db3271 # v2.0.0
        with:
          token: ${{ secrets.PORTAINER_TOKEN }}
          repo: ${{ github.repository }}
          ref: ${{ github.ref }}
          url: ${{ vars.PORTAINER_URL }}
          name: ${{ vars.FRONTEND_DEPLOYMENT_SERVICE }}
          file: ${{ vars.FRONTEND_DEPLOYMENT_COMPOSE_FILE }}
          standalone: true
          prune: true
          pull: true
          type: repo
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          env_data: >
            {
              "IMAGE_TAG": "${{ inputs.version }}",
              "INFISICAL_SECRET_ENV": "${{ vars.INFISICAL_SECRET_ENV }}",
              "PROJECT_ID": "${{ vars.FRONTEND_PROJECT_ID }}",
              "INFISICAL_API_URL": "${{ vars.INFISICAL_API_URL }}",
              "INFISICAL_MACHINE_CLIENT_ID": "${{ secrets.INFISICAL_MACHINE_CLIENT_ID }}",
              "INFISICAL_MACHINE_CLIENT_SECRET": "${{ secrets.INFISICAL_MACHINE_CLIENT_SECRET }}"
            }
