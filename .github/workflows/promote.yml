name: Promote dev → main

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'How to promote dev into main'
        required: true
        type: choice
        default: merge
        options:
          - merge
          - reset

# GITHUB_TOKEN stays read-only: the push uses the GitHub App token below.
permissions:
  contents: read

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    name: Promote dev into main (${{ inputs.strategy }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          # Scoped token: push main (workflows: promoted commits may touch .github/workflows).
          permission-contents: write
          permission-workflows: write

      # Credentials persist on purpose: the steps below push main with the App
      # token, and no artifact is uploaded from this job.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch --all --prune

      - name: Merge dev into main (ff-only)
        if: inputs.strategy == 'merge'
        run: |
          git merge --ff-only origin/dev
          git push origin main

      - name: Reset main to dev (force)
        if: inputs.strategy == 'reset'
        run: |
          echo "::warning::Resetting main to origin/dev — main history will be overwritten"
          git reset --hard origin/dev
          git push --force-with-lease origin main
