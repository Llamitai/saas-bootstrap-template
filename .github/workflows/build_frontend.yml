name: Build & Deploy / Frontend

# workflow_run is gated below: successful Code Quality runs of pushes to this
# repository only, building the exact validated head_sha.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Code Quality]
    types: [completed]
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'Production' || 'Development' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute short SHA
        id: sha
        run: echo "short=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.FRONTEND_REPOSITORY_URI }}
          tags: |
            latest
            type=raw,value=${{ steps.sha.outputs.short }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          context: frontend
          file: frontend/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          target: production
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Portainer
        if: ${{ github.repository != 'Llamitai/wise' }}
        uses: cssnr/portainer-stack-deploy-action@08a2399c37369f461c258deef9cc8a1cf2db3271 # v2.0.0
        with:
          token: ${{ secrets.PORTAINER_TOKEN }}
          repo: ${{ github.repository }}
          ref: ${{ github.event.workflow_run.head_sha }}
          url: ${{ vars.PORTAINER_URL }}
          name: ${{ vars.FRONTEND_DEPLOYMENT_SERVICE }}
          file: ${{ vars.FRONTEND_DEPLOYMENT_COMPOSE_FILE }}
          standalone: true
          prune: true
          pull: true
          type: repo
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          env_data: >
            {
              "IMAGE_TAG": "${{ steps.sha.outputs.short }}",
              "INFISICAL_SECRET_ENV": "${{ vars.INFISICAL_SECRET_ENV }}",
              "PROJECT_ID": "${{ vars.FRONTEND_PROJECT_ID }}",
              "INFISICAL_API_URL": "${{ vars.INFISICAL_API_URL }}",
              "INFISICAL_MACHINE_CLIENT_ID": "${{ secrets.INFISICAL_MACHINE_CLIENT_ID }}",
              "INFISICAL_MACHINE_CLIENT_SECRET": "${{ secrets.INFISICAL_MACHINE_CLIENT_SECRET }}"
            }
