# Valkey configuration for local development, tuned for low latency.
# Production Valkey is provisioned outside this repository; apply the same
# values there (see docs/content/docs/conceptos/arquitectura-backend.mdx).

# Offload socket reads/writes and protocol parsing to I/O threads. Commands
# still execute on the main thread, so no application change is needed.
io-threads 4

# Memory bound. Evicting is safe because the refresh-token store is an
# allowlist (fail-closed): losing a session key only forces a new login, it never
# makes a revoked token valid again. When full, the least recently used keys go
# (idle sessions, rotation grace entries, rate-limit counters) instead of writes
# failing; an evicted counter only restarts that rate-limit window.
maxmemory 512mb
maxmemory-policy allkeys-lru

# Free large values in background threads instead of blocking the event loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# Defragment memory online (jemalloc) to keep RSS close to the dataset size.
activedefrag yes

# Persistence: no RDB fork snapshots (latency spikes). The append-only file only
# keeps sessions across restarts so a restart does not log everyone out; token
# security does not depend on it. `everysec` fsyncs once per second off the write
# path: a crash loses at most that second, where a rotation forces a re-login and
# a logout or password revocation would have to be repeated.
save ""
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes

# Detect dead clients and keep NAT/load-balancer mappings alive.
tcp-keepalive 60
tcp-backlog 511
timeout 0

# Per-command latency percentiles (INFO latencystats) for diagnosis.
latency-tracking yes

# Background task frequency adapts to the number of clients.
hz 10
dynamic-hz yes

# The container publishes the port only on 127.0.0.1 of the host; inside the
# compose network the API and worker reach it by service name.
bind * -::*
protected-mode no
