# RabbitMQ broker configuration for local development, tuned for stability:
# durable replicated queues, early flow control and fast dead-peer detection.
# Production brokers are provisioned outside this repository; apply the same
# values there (see docs/content/docs/conceptos/arquitectura-backend.mdx).

# Queues declared without an explicit type become quorum queues (replicated,
# durable, poison-message handling through delivery-limit).
default_queue_type = quorum

# Block publishers before the node runs out of memory or disk instead of
# crashing. 0.6 of the container memory limit; production keeps >= 2GB of disk.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 512MB

# Detect dead TCP peers (half-open connections) within ~60s.
heartbeat = 30

# A delivery unacknowledged for 30 minutes closes the consumer channel and the
# message returns to the queue. The worker times out a command after 15 minutes
# (AWS_LAMBDA_MAX_TIMEOUT), so this only fires on a stuck consumer.
consumer_timeout = 1800000

# Bound per-connection resources; the application uses two channels per process.
channel_max = 128
# Messages larger than this are rejected (commands are small JSON documents).
max_message_size = 16777216

# Management statistics every 10s (default 5s) to lower background load.
collect_statistics_interval = 10000

# Only localhost may use the built-in guest account (the default). The compose
# file creates the application user from RABBITMQ_USER/RABBITMQ_PASSWORD.
loopback_users.guest = true

log.console = true
log.console.level = info
log.file = false
log.connection.level = warning
log.channel.level = warning
