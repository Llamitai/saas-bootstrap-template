# Exclusively owned test stack. Invoke through scripts/test_stack.py.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
  redis:
    image: redis:8
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.test
    entrypoint: []
    command: [uvicorn, config.main:app, --host, 0.0.0.0, --port, '8200']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ['${TEST_BIND_HOST:-127.0.0.1}::8200']
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: testing
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      ADMIN_API_KEY: test-super-secret-key
      JWT_SECRET_KEY: test-only-jwt-secret-with-at-least-32-characters
      SECRET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      DEFAULT_FROM_EMAIL: noreply@example.com
      SMTP_TLS: 'false'
      SENTRY_DSN: ''
    tmpfs: [/app/public, /app/.pytest_cache, /app/.ruff_cache]
  mailpit:
    image: axllent/mailpit
